<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShuttleStats - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
    <script src="js/app.js"></script>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="app-logo-link">
            <h1 id="logoHeader" class="app-logo">
              <span class="logo-icon">🏸</span>
              <span class="logo-text"
                ><span class="logo-shuttle">Shuttle</span
                ><span class="logo-stats">Stats</span></span
              >
            </h1>
          </a>
          <p id="authSubtitle">Sign in to your account</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none"></div>
        <div id="successMessage" class="success-message" style="display: none"></div>

        <form id="loginForm" class="auth-form">
          <!-- Full Name Fields (only for signup) -->
          <div class="form-group" id="nameFieldsGroup" style="display: none">
            <div class="name-fields">
              <div class="name-field">
                <label for="firstName">First Name</label>
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  placeholder="John"
                  autocomplete="given-name"
                />
                <div class="field-error" id="firstNameError"></div>
              </div>
              <div class="name-field optional">
                <label for="middleName"
                  >Middle Name <span style="color: #9ca3af">(Optional)</span></label
                >
                <input
                  type="text"
                  id="middleName"
                  name="middleName"
                  placeholder="Michael"
                  autocomplete="additional-name"
                />
              </div>
              <div class="name-field">
                <label for="surname">Surname</label>
                <input
                  type="text"
                  id="surname"
                  name="surname"
                  placeholder="Doe"
                  autocomplete="family-name"
                />
                <div class="field-error" id="surnameError"></div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
            <div class="field-error" id="emailError"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-container">
              <input type="password" id="password" name="password" required />
              <button type="button" class="password-toggle" id="passwordToggle">
                <img
                  src="assets/img/eye-closed.png"
                  alt="Toggle password visibility"
                  class="toggle-icon"
                />
              </button>
            </div>
            <div
              class="password-strength-container"
              id="passwordStrengthContainer"
              style="display: none"
            >
              <div class="strength-text" id="strengthText"></div>
              <div class="password-strength-bar">
                <div class="password-strength-fill" id="strengthFill"></div>
              </div>
              <div class="password-requirements" id="passwordRequirements">
                <div class="requirement" id="lengthReq">
                  <span class="requirement-icon requirement-unmet">✓</span>
                  <span>At least 6 characters</span>
                </div>
                <div class="requirement" id="uppercaseReq">
                  <span class="requirement-icon requirement-unmet">✓</span>
                  <span>One uppercase letter</span>
                </div>
                <div class="requirement" id="numberReq">
                  <span class="requirement-icon requirement-unmet">✓</span>
                  <span>One number</span>
                </div>
              </div>
            </div>
            <div class="field-error" id="passwordError"></div>
          </div>

          <div class="form-group" id="confirmPasswordGroup" style="display: none">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-input-container">
              <input type="password" id="confirmPassword" name="confirmPassword" />
              <button type="button" class="password-toggle" id="confirmPasswordToggle">
                👁️
              </button>
            </div>
            <div class="field-error" id="confirmPasswordError"></div>
          </div>

          <!-- Role Selection for Signup -->
          <div class="form-group" id="roleSelectionGroup" style="display: none">
            <label>I am a:</label>
            <div class="role-selection">
              <div class="role-option" id="playerOption" data-role="player">
                🏸 Player
              </div>
              <div class="role-option" id="coachOption" data-role="coach">👨‍🏫 Coach</div>
            </div>
          </div>

          <!-- Coach Selection for Players -->
          <div class="form-group" id="coachSelectionGroup" style="display: none">
            <label>Do you have a coach?</label>
            <div class="coach-options">
              <div class="coach-option" id="hasCoachOption" data-coach="yes">
                Yes, I have a coach
              </div>
              <div class="coach-option" id="soloOption" data-coach="no">I train solo</div>
            </div>
            <div id="coachNameGroup" style="display: none; margin-top: 15px">
              <label for="coachName">Coach Name</label>
              <input
                type="text"
                id="coachName"
                name="coachName"
                placeholder="Enter your coach's name"
              />
              <div class="field-error" id="coachNameError"></div>
            </div>
          </div>

          <!-- Remember Me (only for sign in) -->
          <div class="remember-me" id="rememberMeGroup">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <label for="rememberMe">Remember me</label>
          </div>

          <button type="submit" id="authSubmitBtn" class="auth-btn">
            <span id="authBtnText" class="btn-text">Sign In</span>
            <span
              id="authBtnLoading"
              class="loading-spinner"
              style="display: none"
            ></span>
          </button>

          <!-- Forgot Password (only for sign in) -->
          <div class="forgot-password" id="forgotPasswordGroup">
            <a href="#" id="forgotPasswordLink">Forgot your password?</a>
          </div>

          <div class="auth-divider">
            <span>or</span>
          </div>

          <button type="button" id="googleSignInBtn" class="auth-btn google-btn">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            Continue with Google
          </button>
        </form>

        <!-- Sign Up Form (Hidden by default) -->
        <form id="signupForm" class="auth-form hidden">
          <!-- Name Fields -->
          <div class="form-group">
            <div class="name-fields">
              <div class="name-field">
                <label for="signup-firstName">First Name</label>
                <input
                  type="text"
                  id="signup-firstName"
                  name="firstName"
                  placeholder="John"
                  required
                />
                <div class="field-error" id="signup-firstNameError"></div>
              </div>
              <div class="name-field optional">
                <label for="signup-middleName"
                  >Middle Name <span class="optional-text">(Optional)</span></label
                >
                <input
                  type="text"
                  id="signup-middleName"
                  name="middleName"
                  placeholder="Michael"
                />
              </div>
              <div class="name-field">
                <label for="signup-lastName">Last Name</label>
                <input
                  type="text"
                  id="signup-lastName"
                  name="lastName"
                  placeholder="Doe"
                  required
                />
                <div class="field-error" id="signup-lastNameError"></div>
              </div>
            </div>
          </div>

          <!-- Email Field -->
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input
              type="email"
              id="signup-email"
              name="email"
              placeholder="john.doe@example.com"
              required
            />
            <div class="field-error" id="signup-emailError"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="signup-password">Password</label>
            <div class="password-input-container">
              <input
                type="password"
                id="signup-password"
                name="password"
                placeholder="Enter a strong password"
                required
              />
              <button type="button" class="password-toggle" id="signup-passwordToggle">
                <img
                  src="assets/img/eye-closed.png"
                  alt="Toggle password visibility"
                  class="toggle-icon"
                />
              </button>
            </div>
            <div
              class="password-strength-container"
              id="signup-passwordStrengthContainer"
              style="display: none"
            >
              <div class="strength-text" id="signup-strengthText"></div>
              <div class="password-strength-bar">
                <div class="password-strength-fill" id="signup-strengthFill"></div>
              </div>
              <div class="password-requirements">
                <div class="requirement" id="signup-lengthReq">
                  <span class="requirement-icon requirement-unmet">✓</span>
                  <span>At least 6 characters</span>
                </div>
                <div class="requirement" id="signup-uppercaseReq">
                  <span class="requirement-icon requirement-unmet">✓</span>
                  <span>One uppercase letter</span>
                </div>
                <div class="requirement" id="signup-numberReq">
                  <span class="requirement-icon requirement-unmet">✓</span>
                  <span>One number</span>
                </div>
              </div>
            </div>
            <div class="field-error" id="signup-passwordError"></div>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="signup-confirmPassword">Confirm Password</label>
            <div class="password-input-container">
              <input
                type="password"
                id="signup-confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter your password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="signup-confirmPasswordToggle"
              >
                <img
                  src="assets/img/eye-closed.png"
                  alt="Toggle password visibility"
                  class="toggle-icon"
                />
              </button>
            </div>
            <div class="field-error" id="signup-confirmPasswordError"></div>
          </div>

          <!-- Role Selection -->
          <div class="form-group">
            <label for="signup-role">I am a:</label>
            <select id="signup-role" name="role" required>
              <option value="">Select your role</option>
              <option value="player">Player</option>
              <option value="coach">Coach</option>
            </select>
            <div class="field-error" id="signup-roleError"></div>
          </div>

          <!-- Coach Selection for Players (Dynamic) -->
          <div class="form-group" id="signup-coachSelectionGroup" style="display: none">
            <label>Do you have a coach?</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="hasCoach" value="yes" id="signup-hasCoach" />
                <span class="radio-text">Yes, I have a coach</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="hasCoach" value="no" id="signup-noCoach" />
                <span class="radio-text">I train solo</span>
              </label>
            </div>
          </div>

          <!-- Coach Email Field (Dynamic) -->
          <div class="form-group" id="signup-coachEmailGroup" style="display: none">
            <label for="signup-coachEmail">Coach's Email Address</label>
            <input
              type="email"
              id="signup-coachEmail"
              name="coachEmail"
              placeholder="coach@example.com"
            />
            <div class="field-error" id="signup-coachEmailError"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="signup-submit" class="auth-btn" disabled>
            <span class="btn-text">Create Account</span>
          </button>
        </form>

        <!-- Dynamic Auth Switch - appears after both forms -->
        <div class="auth-switch">
          <span id="authSwitchText">Don't have an account?</span>
          <a href="#" id="authSwitchLink">Sign up</a>
        </div>

        <!-- Loading Overlay for Form -->
        <div id="formLoadingOverlay" class="form-loading-overlay" style="display: none">
          <div class="form-loading-spinner">
            <div class="loading-spinner-centered"></div>
            <div class="loading-text-centered">Signing you in...</div>
          </div>
        </div>
      </div>
    </div>
    <!-- Firebase SDK v10 (Modular) -->
    <script type="module" src="./config/firebase-config.js"></script>

    <!-- Application Scripts -->
    <script src="./js/toast.js"></script>
    <script type="module" src="./js/modals.js" defer></script>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
